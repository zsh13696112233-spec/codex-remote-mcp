<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色任务配置中心</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="sop-editor.css"></head>
<body><aside><div class="brand"><b>CF</b><span>Codex Fleet<small>角色任务配置中心</small></span></div><nav><button class="active" data-page="roles">角色管理</button><button data-page="sops">SOP 工作流</button><button data-page="tasks">任务定义</button><button data-page="feishu">飞书机器人</button></nav><div id="gateway" class="gateway">正在检查网关…</div></aside>
<main><header><div><small>CONFIGURATION CENTER · 8091</small><h1 id="title">角色管理</h1><p id="subtitle">定义协作角色及其职责边界。</p></div><button class="primary" id="create">＋ 新建角色</button></header><section class="toolbar"><input id="search" type="search" placeholder="搜索"><button id="refresh">刷新</button></section><section id="content" class="content"></section></main>

<dialog id="roleDialog"><form method="dialog" id="roleForm"><h2>角色配置</h2><input type="hidden" name="id"><input type="hidden" name="version"><label>角色名称<input name="name" maxlength="100" required></label><label>角色职责<textarea name="duty" maxlength="2000" required></textarea></label><label class="check"><input name="enabled" type="checkbox" checked> 启用</label><footer><button value="cancel">取消</button><button class="primary" value="default">保存</button></footer></form></dialog>

<dialog id="taskDialog"><form method="dialog" id="taskForm"><h2>任务定义</h2><input type="hidden" name="id"><label>任务名称<input name="name" required></label><label>任务目标和背景<textarea name="objective" required></textarea></label><label>选择 SOP<select name="sopId" required></select></label><label>补充说明<textarea name="additionalNotes"></textarea></label><label class="check"><input name="enabled" type="checkbox" checked> 启用</label><footer><button value="cancel">取消</button><button class="primary" value="default">保存任务</button></footer></form></dialog>

<dialog id="runsDialog" class="wide"><form method="dialog"><h2 id="runsTitle">运行记录</h2><div id="runList"></div><footer><button value="cancel">关闭</button></footer></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
