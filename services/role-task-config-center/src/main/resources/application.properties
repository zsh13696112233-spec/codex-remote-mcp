spring.application.name=role-task-config-center
server.port=${SERVER_PORT:8091}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://192.168.5.236:3306/codex_sop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing-v1-schema
codex.gateway.base-url=${CODEX_GATEWAY_URL:http://127.0.0.1:8080}
codex.monitor.base-url=${WORKFLOW_MONITOR_URL:http://127.0.0.1:8090}
codex.default-step-model=${DEFAULT_STEP_MODEL:gpt-5.6-sol}
feishu.enabled=${FEISHU_ENABLED:false}
feishu.app-id=${FEISHU_APP_ID:}
feishu.app-secret=${FEISHU_APP_SECRET:}
feishu.task-definition-id=${FEISHU_TASK_DEFINITION_ID:}
feishu.event-poll-interval-ms=${FEISHU_EVENT_POLL_INTERVAL_MS:1000}
dingtalk.enabled=${DINGTALK_ENABLED:false}
dingtalk.client-id=${DINGTALK_CLIENT_ID:}
dingtalk.client-secret=${DINGTALK_CLIENT_SECRET:}
dingtalk.card-template-id=${DINGTALK_CARD_TEMPLATE_ID:}
dingtalk.event-poll-interval-ms=${DINGTALK_EVENT_POLL_INTERVAL_MS:1000}
spring.web.error.include-message=never
